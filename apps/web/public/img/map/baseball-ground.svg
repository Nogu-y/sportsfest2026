<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 591" width="768" height="591" role="img" aria-labelledby="title desc">
  <title id="title">野球グラウンド会場マップ</title>
  <desc id="desc">受付、ベース配置、ピッチャープレート、外野方向と距離、野球グラウンド名を示した会場マップ</desc>

  <style>
    .frame {
      fill: #ffffff;
      stroke: #6b7280;
      stroke-width: 2.2;
    }

    .label-box {
      fill: #ffffff;
      stroke: #6b7280;
      stroke-width: 2;
    }

    .highlight-box {
      fill: #ffffff;
      stroke: #2f4f8f;
      stroke-width: 5;
    }

    .path-gray {
      fill: none;
      stroke: #c8c8c8;
      stroke-width: 14;
      stroke-linecap: round;
    }

    .path-dashed {
      fill: none;
      stroke: #bdbdbd;
      stroke-width: 2.2;
      stroke-dasharray: 5 4;
    }

    .path-outfield {
      fill: none;
      stroke: #9ab7e8;
      stroke-width: 2.4;
      stroke-dasharray: 5 5;
    }

    .distance-line {
      fill: none;
      stroke: #f7c74f;
      stroke-width: 16;
      stroke-linecap: round;
      opacity: 0.45;
    }

    .distance-line-edge {
      fill: none;
      stroke: #e2a900;
      stroke-width: 2.2;
    }

    .distance-line-small {
      fill: none;
      stroke: #3d79d8;
      stroke-width: 2.6;
      marker-end: url(#arrow-blue);
      marker-start: url(#arrow-blue);
    }

    .legend-line {
      stroke: #111827;
      stroke-width: 8;
    }

    .text {
      fill: #374151;
      font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
      font-size: 18px;
    }

    .text-small {
      font-size: 16px;
    }

    .text-bold {
      font-weight: 700;
    }

    .base-1 {
      fill: #3e70bf;
      stroke: #2f5ca2;
      stroke-width: 2;
    }

    .base-2 {
      fill: #f9c100;
      stroke: #d6a300;
      stroke-width: 2;
    }

    .base-3 {
      fill: #71b046;
      stroke: #5b9836;
      stroke-width: 2;
    }

    .base-home {
      fill: #ef8230;
      stroke: #d86b1b;
      stroke-width: 2;
    }
  </style>

  <defs>
    <marker id="arrow-yellow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f7c74f" />
    </marker>
    <marker id="arrow-yellow-edge" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#e2a900" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#3d79d8" />
    </marker>
  </defs>

  <rect width="768" height="591" fill="#ffffff" />
  <rect class="frame" x="11" y="14" width="706" height="503" />

  <rect class="label-box" x="8" y="343" width="32" height="139" />
  <text class="text text-bold" x="24" y="412" text-anchor="middle" writing-mode="tb">受付</text>

  <path class="path-outfield" d="M92 110 C200 -8, 424 -4, 530 118 C563 156, 568 266, 507 330" />
  <path class="path-dashed" d="M92 110 L144 398 L507 330" />
  <text class="text text-bold" x="104" y="116">外野</text>

  <line class="path-gray" x1="145" y1="398" x2="126" y2="281" />
  <line class="path-gray" x1="126" y1="281" x2="257" y2="252" />
  <line class="path-gray" x1="257" y1="252" x2="281" y2="377" />
  <line class="path-gray" x1="281" y1="377" x2="145" y2="398" />

  <line class="distance-line" x1="145" y1="398" x2="396" y2="67" marker-end="url(#arrow-yellow)" />
  <line class="distance-line-edge" x1="145" y1="398" x2="396" y2="67" marker-end="url(#arrow-yellow-edge)" />
  <text class="text text-bold" transform="translate(282 180) rotate(-57)">67.09 m</text>

  <line class="distance-line-small" x1="161" y1="392" x2="248" y2="273" />
  <text class="text text-small text-bold" transform="translate(205 347) rotate(-54)">13.11 m</text>

  <text class="text text-small text-bold" transform="translate(138 256) rotate(-9)">18.29 m</text>
  <text class="text text-small text-bold" transform="translate(271 285) rotate(80)">18.29 m</text>

  <rect class="base-3" x="111" y="266" width="27" height="27" />
  <rect class="base-2" x="244" y="238" width="27" height="27" />
  <rect class="base-1" x="270" y="363" width="27" height="27" />
  <rect class="base-home" x="132" y="396" width="29" height="29" transform="rotate(-8 146.5 410.5)" />

  <line class="legend-line" x1="201" y1="305" x2="232" y2="325" />

  <line class="legend-line" x1="509" y1="296" x2="541" y2="296" />
  <text class="text text-bold" x="555" y="302">ピッチャープレート</text>

  <rect class="base-3" x="511" y="330" width="27" height="27" />
  <text class="text text-bold" x="549" y="347">3塁ベース</text>

  <rect class="base-2" x="511" y="378" width="27" height="27" />
  <text class="text text-bold" x="549" y="395">2塁ベース</text>

  <rect class="base-1" x="511" y="426" width="27" height="27" />
  <text class="text text-bold" x="549" y="443">1塁ベース</text>

  <rect class="base-home" x="511" y="474" width="27" height="27" />
  <text class="text text-bold" x="549" y="491">ホームベース</text>

  <rect class="highlight-box" x="472" y="524" width="232" height="47" />
  <text class="text text-bold" x="588" y="553" text-anchor="middle">野球グラウンド</text>
</svg>
