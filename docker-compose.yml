services:
  db:
    image: postgres:16-alpine
    container_name: sportsfest2026-db
    env_file:
      - ./apps/api/.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - ./apps/db/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d sportsfest2026"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: node:22-alpine
    container_name: sportsfest2026-api
    env_file:
      - ./apps/api/.env
    working_dir: /workspace
    depends_on:
      db:
        condition: service_healthy
    ports:
      - 8787:8787
    volumes:
      - .:/workspace
      - pnpm-store:/pnpm/store
    command: >
      sh -c "corepack enable
      && pnpm config set store-dir /pnpm/store
      && pnpm install --no-frozen-lockfile
      && pnpm --filter @sportsfest/api dev"

volumes:
  root-node-modules:
  api-node-modules:
  web-node-modules:
  shared-node-modules:
  config-node-modules:
